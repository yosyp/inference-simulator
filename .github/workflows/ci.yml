name: CI

# Every push and pull request (06-deployment §4, K19). No AWS access.
# deploy.yml also calls this file, so a deploy runs exactly these checks and
# ships the build that passed them (the `dist` artifact).
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # When deploy.yml calls this file, github.workflow is "Deploy", not "CI".
  # That keeps a deploy's checks out of the group of the plain CI run for the
  # same push to prod, so neither run cancels the other.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Ordinary pushes and PRs run the fast tier; prod (the deploy gate) runs the full suite,
      # including the whole-day simulation tests. Run `pnpm verify` locally before pushing.
      - run: pnpm test:fast
        if: github.ref != 'refs/heads/prod'
      - run: pnpm test
        if: github.ref == 'refs/heads/prod'
      - run: pnpm build

      # Production-CSP smoke test (00-build §7.4, I4). `pnpm e2e` rebuilds dist/
      # and serves it with the headers from infra/site/headers.json.
      - run: pnpm exec playwright install --with-deps chromium
      - id: e2e
        run: pnpm e2e
      - if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      # The build the smoke test just ran against. deploy.yml uploads it to S3.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Format and validate both stacks with no backend and no credentials
  # (infra/README.md §6).
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TF_IN_AUTOMATION: '1'
      TF_INPUT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/bootstrap init -backend=false -input=false
      - run: terraform -chdir=infra/bootstrap validate
      - run: terraform -chdir=infra/site init -backend=false -input=false
      - run: terraform -chdir=infra/site validate
