# Engine configuration shared by every run (03 §3): one vLLM 0.20.1 instance per GPU, TP=1.
# Every run starts vLLM with exactly these flags; R0 records what vLLM resolves them to.

model = "meta-llama/Llama-3.1-8B-Instruct"   # served from the local Hugging Face cache (HF_HUB_OFFLINE=1)
dtype = "float16"
tensor_parallel_size = 1
max_model_len = 131072                        # Theme 3 Q2: leave 128k
enable_prefix_caching = true
enable_chunked_prefill = true
gpu_memory_utilization = 0.9                  # vLLM's default, pinned so a future default change can't move the KV pool
host = "127.0.0.1"                            # the load generator runs on this host (03 §5)
base_port = 8001                              # GPU i listens on 8001 + i
seed = 0
# Left at vLLM defaults on purpose; R0 records them. On an A100 40GB the API server picks
# max_num_batched_tokens 2048 and max_num_seqs 256 (vllm/engine/arg_utils.py, 0.20.1).
extra_args = []

# 03 §3 estimate. Used only to validate that runs meant to stay below the KV ceiling do.
kv_pool_estimate_tokens = 140000

[env]
VLLM_SERVER_DEV_MODE = "1"     # exposes POST /reset_prefix_cache and GET /server_info on the loopback server
VLLM_NO_USAGE_STATS = "1"      # no telemetry calls from the benchmark host
DO_NOT_TRACK = "1"
HF_HUB_OFFLINE = "1"           # weights and tokenizer from the local cache only; no token needed at run time
CUDA_DEVICE_ORDER = "PCI_BUS_ID"  # CUDA index == nvidia-smi/NVML index
PYTHONUNBUFFERED = "1"         # log lines arrive as they happen, so phase timestamps are accurate
NO_COLOR = "1"

# GPU -> NUMA node for numactl --cpunodebind/--membind. From `nvidia-smi topo -m` on this
# host: GPU0 CPU affinity 0-39,80-119 (node 0), GPU1 40-79,120-159 (node 1). `harness
# preflight` compares this with sysfs.
[numa]
gpu0 = 0
gpu1 = 1

[timeouts]
ready_s = 900   # a replacement-host start recompiles; allow 15 min before calling it failed
stop_s = 60

[bench]
backend = "vllm"               # /v1/completions, streamed
temperature = 0.0              # greedy: fixed sampling cost per token (bench no longer defaults to 0)
percentile_metrics = "ttft,tpot,itl,e2el"
metric_percentiles = "50,90,99"
drop_generated_texts = true    # random-token completions are noise; output_lens are kept
pin_client_numa = true         # bench client on its server's NUMA node, so it never crosses the socket link
